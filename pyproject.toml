[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-foundry"
version = "0.1.0"
description = "A small, generic roleplay-context engine for curated scene packets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "rp-foundry contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rp-foundry = "rp_foundry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
